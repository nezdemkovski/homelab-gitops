---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metrics-server
  namespace: kube-system
spec:
  chart:
    spec:
      chart: metrics-server
      interval: 1h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: metrics-server
      version: 3.14.0
  driftDetection:
    mode: enabled
  install:
    disableTakeOwnership: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 1h0m0s
  releaseName: metrics-server
  storageNamespace: kube-system
  targetNamespace: kube-system
  timeout: 5m0s
  upgrade:
    disableTakeOwnership: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    defaultArgs:
    - --cert-dir=/tmp
    - --kubelet-preferred-address-types=InternalIP
    - --kubelet-use-node-status-port
    - --metric-resolution=15s
    - --kubelet-insecure-tls
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
    service:
      type: ClusterIP
