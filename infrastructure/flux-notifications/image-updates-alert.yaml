---
apiVersion: notification.toolkit.fluxcd.io/v1beta3
kind: Alert
metadata:
  name: telegram-image-updates
  namespace: flux-system
spec:
  eventSeverity: info
  eventSources:
  - kind: ImageUpdateAutomation
    name: flux-system
  providerRef:
    name: telegram
  inclusionList:
  - pushed commit
  eventMetadata:
    cluster: homelab
    summary: Flux updated image pins in Git
