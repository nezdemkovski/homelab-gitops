---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  chart:
    spec:
      chart: local-path-provisioner
      interval: 1h0m0s
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: local-path-provisioner
      version: 0.0.38
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  interval: 1h0m0s
  releaseName: local-path-provisioner
  storageNamespace: local-path-storage
  targetNamespace: local-path-storage
  timeout: 5m0s
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    nodePathMap:
    - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
      paths:
      - /var/lib/local-path-provisioner
    storageClass:
      create: true
      defaultClass: true
      name: local-path
      reclaimPolicy: Retain
      volumeBindingMode: WaitForFirstConsumer
