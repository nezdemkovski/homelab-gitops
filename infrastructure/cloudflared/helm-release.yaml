---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflared
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/cloudflared
      interval: 1h0m0s
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h0m0s
  releaseName: cloudflared
  storageNamespace: cloudflared
  targetNamespace: cloudflared
  timeout: 10m0s
  upgrade:
    strategy:
      name: RetryOnFailure
