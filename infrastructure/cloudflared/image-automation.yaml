---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  image: cloudflare/cloudflared
  interval: 15m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  imageRepositoryRef:
    name: cloudflared
  policy:
    semver:
      range: '>=2026.9.3 <2027.0.0'
