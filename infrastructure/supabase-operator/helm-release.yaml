apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: supabase-operator
  namespace: supabase-operator
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: supabase-operator
      version: 0.8.4
      sourceRef:
        kind: HelmRepository
        name: supabase
        namespace: supabase
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
  driftDetection:
    mode: enabled
  values:
    manager:
      image:
        repository: ghcr.io/supabase-community/supabase-operator
        tag: v0.8.4
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 256Mi
