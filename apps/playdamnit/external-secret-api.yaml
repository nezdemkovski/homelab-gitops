apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playdamnit-api-env
  namespace: playdamnit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: playdamnit-api-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NODE_ENV: production
        PORT: "3030"
        LOG_LEVEL: info
        POSTGRES_URL: 'postgresql://{{ .dbUsername | urlquery }}:{{ .dbPassword | urlquery }}@playdamnit-postgres-rw.playdamnit.svc.cluster.local:5432/playdamnit'
        BETTER_AUTH_SECRET: '{{ .betterAuthSecret }}'
        # Public origin of the auth routes (served under /api/auth on the same host as the web app)
        BETTER_AUTH_URL: https://playdamnit.com
        EMAIL_FROM: "Play, damn it! <noreply@playdamnit.com>"
        RESEND_API_KEY: '{{ .resendApiKey }}'
        OPENAI_API_KEY: '{{ .openaiApiKey }}'
        STEAM_API_KEY: '{{ .steamApiKey }}'
        OPENAI_MODEL: gpt-4o
        SENTRY_DSN: '{{ .sentryDsn }}'
        IGDB_WEBHOOK_SECRET: '{{ .igdbWebhookSecret }}'
        # Web and API share the host; requests arrive through the Cloudflare tunnel
        TRUSTED_ORIGINS: https://playdamnit.com,https://games.nezdemkovski.cloud
        TRUST_PROXY: "true"
  data:
    - secretKey: dbUsername
      remoteRef: {key: playdamnit, property: DB_USER}
    - secretKey: dbPassword
      remoteRef: {key: playdamnit, property: DB_PASSWORD}
    - secretKey: betterAuthSecret
      remoteRef: {key: playdamnit, property: BETTER_AUTH_SECRET}
    - secretKey: resendApiKey
      remoteRef: {key: playdamnit, property: RESEND_API_KEY}
    - secretKey: openaiApiKey
      remoteRef: {key: playdamnit, property: OPENAI_API_KEY}
    - secretKey: steamApiKey
      remoteRef: {key: playdamnit, property: STEAM_API_KEY}
    - secretKey: sentryDsn
      remoteRef: {key: playdamnit, property: SENTRY_DSN_API}
    - secretKey: igdbWebhookSecret
      remoteRef: {key: playdamnit, property: IGDB_WEBHOOK_SECRET}
