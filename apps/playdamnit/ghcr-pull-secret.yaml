apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playdamnit-ghcr
  namespace: playdamnit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: playdamnit-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: playdamnit-ghcr
        property: username
    - secretKey: token
      remoteRef:
        key: playdamnit-ghcr
        property: password
