apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playdamnit-librarian-env
  namespace: playdamnit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: playdamnit-librarian-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NODE_ENV: production
        LOG_LEVEL: info
        POSTGRES_URL: 'postgresql://{{ .dbUsername | urlquery }}:{{ .dbPassword | urlquery }}@playdamnit-postgres-rw.playdamnit.svc.cluster.local:5432/playdamnit'
        TWITCH_CLIENT_ID: '{{ .twitchClientId }}'
        TWITCH_CLIENT_SECRET: '{{ .twitchClientSecret }}'
        # Where IGDB posts webhooks: the API behind the tunnel, same host as the web app
        WEBHOOK_BASE_URL: https://games.nezdemkovski.cloud
        IGDB_WEBHOOK_SECRET: '{{ .igdbWebhookSecret }}'
  data:
    - secretKey: dbUsername
      remoteRef: {key: playdamnit-postgres, property: username}
    - secretKey: dbPassword
      remoteRef: {key: playdamnit-postgres, property: password}
    - secretKey: twitchClientId
      remoteRef: {key: playdamnit-librarian, property: TWITCH_CLIENT_ID}
    - secretKey: twitchClientSecret
      remoteRef: {key: playdamnit-librarian, property: TWITCH_CLIENT_SECRET}
    - secretKey: igdbWebhookSecret
      remoteRef: {key: playdamnit-api, property: IGDB_WEBHOOK_SECRET}
