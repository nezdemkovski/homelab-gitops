apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: playdamnit-librarian-env
  namespace: playdamnit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: playdamnit-librarian-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NODE_ENV: production
        LOG_LEVEL: info
        POSTGRES_URL: 'postgresql://{{ .dbUsername | urlquery }}:{{ .dbPassword | urlquery }}@playdamnit-postgres-rw.playdamnit.svc.cluster.local:5432/playdamnit'
        TWITCH_CLIENT_ID: '{{ .twitchClientId }}'
        TWITCH_CLIENT_SECRET: '{{ .twitchClientSecret }}'
        # Where IGDB posts webhooks: the API behind the tunnel, same host as the web app
        WEBHOOK_BASE_URL: https://playdamnit.com
        IGDB_WEBHOOK_SECRET: '{{ .igdbWebhookSecret }}'
        SENTRY_DSN: '{{ .sentryDsn }}'
  data:
    - secretKey: dbUsername
      remoteRef: {key: playdamnit, property: DB_USER}
    - secretKey: dbPassword
      remoteRef: {key: playdamnit, property: DB_PASSWORD}
    - secretKey: twitchClientId
      remoteRef: {key: playdamnit, property: TWITCH_CLIENT_ID}
    - secretKey: twitchClientSecret
      remoteRef: {key: playdamnit, property: TWITCH_CLIENT_SECRET}
    - secretKey: igdbWebhookSecret
      remoteRef: {key: playdamnit, property: IGDB_WEBHOOK_SECRET}
    - secretKey: sentryDsn
      remoteRef: {key: playdamnit, property: SENTRY_DSN_LIBRARIAN}
