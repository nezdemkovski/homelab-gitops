---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: paperclip
  namespace: paperclip
spec:
  image: ghcr.io/paperclipai/paperclip
  interval: 15m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: paperclip
  namespace: paperclip
spec:
  digestReflectionPolicy: Always
  imageRepositoryRef:
    name: paperclip
  interval: 15m0s
  policy:
    semver:
      range: '>=2026.916.1 <2027.0.0'
