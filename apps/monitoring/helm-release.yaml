---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: flux-system
spec:
  chart:
    spec:
      chart: ./charts/monitoring
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 1h0m0s
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
  interval: 1h0m0s
  releaseName: monitoring
  storageNamespace: monitoring
  targetNamespace: monitoring
  timeout: 15m0s
  upgrade:
    strategy:
      name: RetryOnFailure
