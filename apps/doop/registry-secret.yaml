apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doop-registry
  namespace: doop
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: doop-registry
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":{{ .username | toJson }},"password":{{ .password | toJson }},"auth":"{{ printf "%s:%s" .username .password | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: amela
        property: GHCR_USER
    - secretKey: password
      remoteRef:
        key: amela
        property: GHCR_TOKEN
