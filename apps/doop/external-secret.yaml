apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: doop-env
  namespace: doop
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: doop-env
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: doop
        property: DB_URL
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: doop
        property: BETTER_AUTH_SECRET
    - secretKey: ADMIN_EMAILS
      remoteRef:
        key: doop
        property: ADMIN_EMAILS
    - secretKey: SIGNUP_EMAIL_DOMAINS
      remoteRef:
        key: doop
        property: SIGNUP_EMAIL_DOMAINS
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: synology-rustfs
        property: RUSTFS_ACCESS_KEY
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: synology-rustfs
        property: RUSTFS_SECRET_KEY
    - secretKey: SMTP_PASS
      remoteRef:
        key: auth
        property: RESEND_API_KEY
    - secretKey: EMAIL_FROM
      remoteRef:
        key: auth
        property: EMAIL_FROM
