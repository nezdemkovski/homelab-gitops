apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: doop-postgres
  namespace: doop
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  bootstrap:
    initdb:
      database: doop
      owner: doop
      secret:
        name: doop-postgres-owner
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 768Mi
  storage:
    storageClass: local-path
    size: 5Gi
  backup:
    barmanObjectStore:
      serverName: doop-postgres-pg18
      destinationPath: "s3://cnpg-backups/doop-postgres"
      endpointURL: "http://10.77.77.190:9000"
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: ACCESS_SECRET_KEY
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "30d"
