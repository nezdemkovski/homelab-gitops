apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haymaker-postgres-owner
  namespace: haymaker
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: haymaker-postgres-owner
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: haymaker-postgres
        property: username
    - secretKey: password
      remoteRef:
        key: haymaker-postgres
        property: password
