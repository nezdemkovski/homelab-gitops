apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openmarkers-postgres-owner
  namespace: openmarkers
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openmarkers-postgres-owner
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  data:
    - secretKey: username
      remoteRef:
        key: openmarkers
        property: DB_USER
    - secretKey: password
      remoteRef:
        key: openmarkers
        property: DB_PASSWORD
