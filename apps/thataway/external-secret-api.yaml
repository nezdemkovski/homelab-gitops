apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thataway-api-env
  namespace: thataway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: thataway-api-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_URL: 'postgresql://{{ .dbUsername | urlquery }}:{{ .dbPassword | urlquery }}@thataway-postgres-rw.thataway.svc.cluster.local:5432/thataway'
        # The illustrations' bucket on the NAS (RustFS) and the art worker's token
        S3_ACCESS_KEY: '{{ .s3AccessKey }}'
        S3_SECRET_KEY: '{{ .s3SecretKey }}'
        ART_WORKER_TOKEN: '{{ .artWorkerToken }}'
  data:
    - secretKey: dbUsername
      remoteRef: {key: thataway, property: DB_USER}
    - secretKey: dbPassword
      remoteRef: {key: thataway, property: DB_PASSWORD}
    - secretKey: s3AccessKey
      remoteRef: {key: synology-rustfs, property: RUSTFS_ACCESS_KEY}
    - secretKey: s3SecretKey
      remoteRef: {key: synology-rustfs, property: RUSTFS_SECRET_KEY}
    - secretKey: artWorkerToken
      remoteRef: {key: thataway, property: ART_WORKER_TOKEN}
