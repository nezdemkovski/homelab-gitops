apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thataway-api-env
  namespace: thataway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: thataway-api-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_URL: 'postgresql://{{ .dbUsername | urlquery }}:{{ .dbPassword | urlquery }}@thataway-postgres-rw.thataway.svc.cluster.local:5432/thataway'
  data:
    - secretKey: dbUsername
      remoteRef: {key: thataway, property: DB_USER}
    - secretKey: dbPassword
      remoteRef: {key: thataway, property: DB_PASSWORD}
