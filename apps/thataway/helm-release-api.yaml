---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thataway-api
  namespace: thataway
spec:
  chartRef:
    kind: OCIRepository
    name: thataway-api
  interval: 1h0m0s
  releaseName: thataway-api
  values:
    fullnameOverride: thataway-api
    image:
      repository: ghcr.io/nezdemkovski/thataway-api
      tag: 0.3.1@sha256:0d24a3b53e3c075e1d4b8d2f4494f5fc453a98648e188f771fbada39b8507b7e
    env:
      PUBLIC_URL: https://thataway.nezdemkovski.cloud
      # Illustrations: the thataway-art bucket on the NAS, read by the app through the tunnel
      S3_ENDPOINT: http://10.77.77.190:9000
      S3_BUCKET: thataway-art
      ART_PUBLIC_BASE_URL: https://thataway.nezdemkovski.cloud/thataway-art
    imagePullSecrets:
    - name: thataway-ghcr
    # POSTGRES_URL, built from the credentials in 1Password
    envSecretName: thataway-api-env
