---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thataway-api
  namespace: thataway
spec:
  chartRef:
    kind: OCIRepository
    name: thataway-api
  interval: 1h0m0s
  releaseName: thataway-api
  values:
    fullnameOverride: thataway-api
    image:
      repository: ghcr.io/nezdemkovski/thataway-api
      tag: 0.2.1@sha256:21db3d21c956e1f0f7d4fcccdfc932b69eb96287694519d62d1ba94dc0c03fe1
    env:
      # Art URLs are built on the public hostname
      PUBLIC_URL: https://thataway.nezdemkovski.cloud
    imagePullSecrets:
    - name: thataway-ghcr
    # POSTGRES_URL, built from the credentials in 1Password
    envSecretName: thataway-api-env
