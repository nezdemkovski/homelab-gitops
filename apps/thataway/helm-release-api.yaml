---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thataway-api
  namespace: thataway
spec:
  chartRef:
    kind: OCIRepository
    name: thataway-api
  interval: 1h0m0s
  releaseName: thataway-api
  values:
    fullnameOverride: thataway-api
    image:
      repository: ghcr.io/nezdemkovski/thataway-api
      tag: 0.2.0@sha256:0ff50a0ba6bf3a9c9cc634edfdcded74a5a8918e56bc887c8422ba36cb460c60
    imagePullSecrets:
    - name: thataway-ghcr
    # POSTGRES_URL, built from the credentials in 1Password
    envSecretName: thataway-api-env
