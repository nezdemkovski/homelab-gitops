---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thataway-api
  namespace: thataway
spec:
  chartRef:
    kind: OCIRepository
    name: thataway-api
  interval: 1h0m0s
  releaseName: thataway-api
  values:
    fullnameOverride: thataway-api
    image:
      repository: ghcr.io/nezdemkovski/thataway-api
      tag: 0.1.1@sha256:edb45ca248e0999642a1ce36081a3f3403b3eb8fd5c588bfb450c26af647f7b2
    imagePullSecrets:
    - name: thataway-ghcr
    # POSTGRES_URL, built from the credentials in 1Password
    envSecretName: thataway-api-env
