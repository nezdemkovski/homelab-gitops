---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thataway-api
  namespace: thataway
spec:
  chartRef:
    kind: OCIRepository
    name: thataway-api
  interval: 1h0m0s
  releaseName: thataway-api
  values:
    fullnameOverride: thataway-api
    image:
      repository: ghcr.io/nezdemkovski/thataway-api
      tag: 0.1.2@sha256:db1da4ca648e3d3fa69319f3d02d7f6fb7c8e0baa9261cb21798e814d1f6c81b
    imagePullSecrets:
    - name: thataway-ghcr
    # POSTGRES_URL, built from the credentials in 1Password
    envSecretName: thataway-api-env
