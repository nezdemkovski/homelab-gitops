---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thataway-api
  namespace: thataway
spec:
  chartRef:
    kind: OCIRepository
    name: thataway-api
  interval: 1h0m0s
  releaseName: thataway-api
  values:
    fullnameOverride: thataway-api
    image:
      repository: ghcr.io/nezdemkovski/thataway-api
      tag: 0.1.0@sha256:129b95f65be93626c074185e00ffa7e94e053b9bf152fdada9a2f187db2d125e
    imagePullSecrets:
    - name: thataway-ghcr
    extraEnv:
    # Connection string generated by CloudNativePG for the application owner
    - name: POSTGRES_URL
      valueFrom:
        secretKeyRef:
          name: thataway-postgres-app
          key: uri
