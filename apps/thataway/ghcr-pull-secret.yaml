apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: thataway-ghcr
  namespace: thataway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: thataway-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"{{ .username }}","password":"{{ .token }}","auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}
  # The images live under the same GitHub user as haymaker's: one read:packages token serves both
  data:
    - secretKey: username
      remoteRef:
        key: haymaker
        property: GHCR_USER
    - secretKey: token
      remoteRef:
        key: haymaker
        property: GHCR_TOKEN
