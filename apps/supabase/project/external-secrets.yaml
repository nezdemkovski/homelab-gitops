apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-postgres
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-postgres-auth
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: supabase
        property: DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-keys
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-keys
    creationPolicy: Merge
  data:
  - secretKey: secret-key-base
    remoteRef:
      key: supabase
      property: REALTIME_SECRET_KEY_BASE
  - secretKey: crypto-key
    remoteRef:
      key: supabase
      property: META_CRYPTO_KEY
  - secretKey: realtime-db-enc-key
    remoteRef:
      key: supabase
      property: REALTIME_DB_ENC_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-envoy
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-envoy-auth
    creationPolicy: Merge
  data:
  - secretKey: username
    remoteRef:
      key: supabase
      property: DASHBOARD_USERNAME
  - secretKey: password
    remoteRef:
      key: supabase
      property: DASHBOARD_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-storage
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-storage-auth
    creationPolicy: Merge
  data:
  - secretKey: accessKeyId
    remoteRef:
      key: supabase
      property: S3_KEY_ID
  - secretKey: accessKeySecret
    remoteRef:
      key: supabase
      property: S3_ACCESS_KEY
