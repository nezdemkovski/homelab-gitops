---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-storage
  namespace: supabase
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-storage-auth
    creationPolicy: Merge
  data:
  - secretKey: accessKeyId
    remoteRef:
