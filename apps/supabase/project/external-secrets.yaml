---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-jwt
  namespace: supabase
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-jwt
    creationPolicy: Merge
  data:
  - secretKey: jwt-secret
    remoteRef:
      key: supabase
      property: JWT_SECRET
  - secretKey: anon-key
    remoteRef:
      key: supabase
      property: ANON_KEY
  - secretKey: service-key
    remoteRef:
      key: supabase
      property: SERVICE_KEY
  - secretKey: jwt-keys
    remoteRef:
      key: supabase
      property: OPERATOR_JWT_KEYS
  - secretKey: jwt-jwks
    remoteRef:
      key: supabase
      property: OPERATOR_JWT_JWKS
  - secretKey: anon-key-asymmetric
    remoteRef:
      key: supabase
      property: OPERATOR_ANON_KEY_ASYMMETRIC
  - secretKey: service-key-asymmetric
    remoteRef:
      key: supabase
      property: OPERATOR_SERVICE_KEY_ASYMMETRIC
  - secretKey: publishable-key
    remoteRef:
      key: supabase
      property: OPERATOR_PUBLISHABLE_KEY
  - secretKey: secret-key
    remoteRef:
      key: supabase
      property: OPERATOR_SECRET_KEY
