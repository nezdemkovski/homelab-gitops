apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-postgres
  namespace: supabase
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-postgres-auth
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: supabase
        property: DB_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-keys
  namespace: supabase
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-keys
    creationPolicy: Merge
  data:
  - secretKey: secret-key-base
    remoteRef:
      key: supabase
      property: REALTIME_SECRET_KEY_BASE
  - secretKey: crypto-key
    remoteRef:
      key: supabase
      property: META_CRYPTO_KEY
  - secretKey: vault-enc-key
    remoteRef:
      key: supabase
      property: OPERATOR_VAULT_ENC_KEY
  - secretKey: realtime-db-enc-key
    remoteRef:
      key: supabase
      property: REALTIME_DB_ENC_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
