apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: supabase-operator-postgres
  namespace: supabase
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: supabase-postgres-auth
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: supabase
        property: DB_PASSWORD
