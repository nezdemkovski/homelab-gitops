apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  source:
    repoURL: ghcr.io/nezdemkovski/charts
    chart: auth
    targetRevision: 0.2.49
    helm:
      releaseName: auth
      values: |
        env:
          autoMigrate: "false"
          trustProxyHeaders: "true"
          publicBaseUrl: https://auth.nezdemkovski.cloud
          adminEmail: yuri@nezdemkovski.com
          redisUrlSecret:
            name: auth-redis
            key: REDIS_URL
          postgresHost: auth-postgres-rw.auth.svc.cluster.local
          postgresPort: "5432"
          postgresDb: auth

        api:
          image:
            tag: v0.1.100
            digest: sha256:3bce8532e600902f960e5816cbdb69c34571910535ed1185538742c99927e319

        admin:
          image:
            tag: v0.1.100
            digest: sha256:6ae7e27242764e358cc6d54babe3bc63486e6c6bda52fe36218e180023c800ba

        login:
          image:
            tag: v0.1.100
            digest: sha256:39f4841044ec1bf4ef427e5fd1cde1630c48c219a4c1955e1eb598ae4be5100e

        router:
          image:
            tag: v0.1.100
            digest: sha256:237d1d5aa86a10faafcfd6883c441122c0c9ab1d98b93a11c40fc55c071a2439

        postgres:
          credentialsSecret:
            name: auth-postgres-owner
            usernameKey: username
            passwordKey: password

        objectStorage:
          enabled: true
          bucket: auth-public
          region: us-east-1
          storage:
            storageClass: local-path
            size: 5Gi

        onepassword:
          appItem: auth
          redisItem: auth-redis
          redisPasswordProperty: password
  destination:
    server: https://kubernetes.default.svc
    namespace: auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
