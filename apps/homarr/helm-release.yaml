---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homarr
  namespace: homarr
spec:
  chartRef:
    kind: OCIRepository
    name: homarr
    namespace: homarr
  interval: 1h0m0s
  releaseName: homarr
  storageNamespace: homarr
  targetNamespace: homarr
  values:
    env:
      TZ: Europe/Prague
    envSecrets:
      dbEncryption:
        existingSecret: homarr-env
        key: SECRET_ENCRYPTION_KEY
    image:
      tag: v1.61.0
    persistence:
      homarrDatabase:
        enabled: true
        size: 1Gi
        storageClassName: local-path
    service:
      type: ClusterIP
    strategyType: Recreate
