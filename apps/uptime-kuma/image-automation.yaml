---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  image: louislam/uptime-kuma
  interval: 15m0s
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: uptime-kuma
  namespace: uptime-kuma
spec:
  imageRepositoryRef:
    name: uptime-kuma
  policy:
    semver:
      range: '>=2.5.5 <2.6.0'
