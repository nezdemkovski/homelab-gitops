---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metrics-server
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  interval: 10m0s
  path: ./infrastructure/metrics-server
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  timeout: 5m0s
  wait: true
