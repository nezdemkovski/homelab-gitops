---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: doop
  namespace: flux-system
spec:
  dependsOn:
  - name: cloudnative-pg
  - name: onepassword-store
  interval: 10m0s
  path: ./apps/doop
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
