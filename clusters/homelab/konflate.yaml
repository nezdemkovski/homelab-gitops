---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: konflate
  namespace: flux-system
spec:
  dependsOn:
    - name: cilium
  interval: 10m0s
  path: ./infrastructure/konflate
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
