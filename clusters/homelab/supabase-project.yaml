---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: supabase-project
  namespace: flux-system
spec:
  dependsOn:
  - name: supabase-operator
  - name: supabase
  interval: 10m0s
  path: ./apps/supabase/project
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 2m0s
  wait: true
