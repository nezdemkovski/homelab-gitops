---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homarr-flux
  namespace: flux-system
spec:
  dependsOn:
  - name: flux-system
  interval: 10m0s
  path: ./clusters/homelab/apps/homarr-flux
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
