---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: network-policies
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: cilium
  interval: 10m0s
  path: ./infrastructure/network-policies
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  timeout: 2m0s
  wait: true
