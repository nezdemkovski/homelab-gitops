---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@nezdemkovski.cloud
        name: Flux
      messageTemplate: 'chore(images): update automated image pins'
    push:
      branch: master
  interval: 15m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  update:
    path: ./
    strategy: Setters
