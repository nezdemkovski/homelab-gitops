---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: local-path-provisioner
  interval: 10m0s
  path: ./infrastructure/cloudnative-pg
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m0s
  wait: true
