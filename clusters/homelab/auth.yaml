---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: auth
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: auth-infra
  interval: 10m0s
  path: ./apps/auth/release
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  timeout: 10m0s
  wait: true
