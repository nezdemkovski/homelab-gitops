---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: paperclip
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  interval: 10m0s
  path: ./apps/paperclip
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
