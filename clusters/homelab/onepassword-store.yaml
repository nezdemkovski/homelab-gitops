---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: onepassword-store
  namespace: flux-system
spec:
  deletionPolicy: Orphan
  dependsOn:
  - name: external-secrets
  - name: onepassword-connect
  interval: 10m0s
  path: ./infrastructure/onepassword-store
  prune: true
  retryInterval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  suspend: true
  timeout: 5m0s
  wait: true
