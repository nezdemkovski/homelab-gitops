name: Build Doop

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-doop
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out upstream release v0.12.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kgoedecke/doop
          ref: 65b24a5ee0696f2646720cf57727e68873cd6fba
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nezdemkovski/doop:0.12.0
          labels: |
            org.opencontainers.image.source=https://github.com/nezdemkovski/homelab-gitops
            org.opencontainers.image.url=https://github.com/kgoedecke/doop
            org.opencontainers.image.revision=65b24a5ee0696f2646720cf57727e68873cd6fba
            org.opencontainers.image.version=0.12.0
            org.opencontainers.image.licenses=AGPL-3.0-only
      - name: Record digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/nezdemkovski/doop:0.12.0@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
