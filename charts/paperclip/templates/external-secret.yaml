apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "paperclip.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  data:
    - secretKey: BETTER_AUTH_SECRET
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: BETTER_AUTH_SECRET
    - secretKey: DATABASE_URL
      remoteRef:
        key: {{ .Values.onepassword.postgresItem }}
        property: DATABASE_URL
