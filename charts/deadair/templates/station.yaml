apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: deadair-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.persistence.storageClass }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deadair
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: deadair
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deadair
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      hostAliases:
        - ip: "127.0.0.1"
          hostnames: [app, icecast, liquidsoap, analysis, kokoro]
      containers:
        - name: station
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 80
            - name: api
              containerPort: 3000
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            - name: APP_BASE_URL
              value: {{ .Values.baseUrl | quote }}
            - name: SPA_BASE_URL
              value: {{ .Values.baseUrl | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: DATABASE_HOST
              value: deadair-postgres-cnpg-rw
            - name: DATABASE_NAME
              value: deadair
            - name: DATABASE_USER
              value: deadair
            - name: REDIS_HOST
              value: deadair-redis
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: api}
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: deadair-data
---
apiVersion: v1
kind: Service
metadata:
  name: deadair
spec:
  selector:
    app.kubernetes.io/name: deadair
  ports:
    - name: http
      port: 80
      targetPort: http
