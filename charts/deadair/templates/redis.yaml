apiVersion: apps/v1
kind: Deployment
metadata:
  name: deadair-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deadair-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deadair-redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          args: [redis-server, --save, "", --appendonly, "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            exec:
              command: [redis-cli, ping]
          livenessProbe:
            exec:
              command: [redis-cli, ping]
---
apiVersion: v1
kind: Service
metadata:
  name: deadair-redis
spec:
  selector:
    app.kubernetes.io/name: deadair-redis
  ports:
    - port: 6379
      targetPort: redis
