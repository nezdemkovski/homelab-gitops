postgres:
  clusterName: openmarkers-postgres
  database: openmarkers
  owner: openmarkers
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-system-trixie
  storage:
    storageClass: local-path
    size: 2Gi
  backup:
    enabled: true
    destinationPath: s3://cnpg-backups/openmarkers-postgres
    endpointURL: http://10.77.77.190:9000
    secretName: cnpg-backup-s3
    onepasswordItem: synology-rustfs
    retentionPolicy: "30d"
    schedule: "0 30 3 * * *"


onepassword:
  postgresItem: openmarkers-postgres
  appItem: openmarkers

openmarkers:
  fullnameOverride: openmarkers
  image:
    repository: ghcr.io/nezdemkovski/openmarkers
  config:
    authIssuer: https://auth.nezdemkovski.cloud/api/openmarkers
    authClientId: 2bxTB9FZXW8rVkXCd4N9QJU9-TbnrFh8
    authMcpResource: https://openmarkers.app/mcp
  secret:
    create: false
    name: openmarkers-env
