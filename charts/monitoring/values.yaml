onepassword:
  mcpItem: grafana
  plausibleItem: plausible

kube-prometheus-stack:
  nameOverride: prometheus
  fullnameOverride: prometheus
  grafana:
    enabled: false
  alertmanager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    create: true
    rules:
      alertmanager: false
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
  prometheusOperator:
    tls:
      enabled: false
    admissionWebhooks:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 256Mi
  prometheus:
    prometheusSpec:
      retention: 14d
      retentionSize: 8GiB
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: fix-storage-permissions
          image: busybox:1.38.0
          command:
            - sh
            - -c
            - chown -R 1000:2000 /prometheus
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: prometheus-prometheus-prometheus-db
              mountPath: /prometheus
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1536Mi
      storageSpec:
        # Talos kubelet has no bind mount for this hostPath. A subPath would
        # resolve inside its disposable overlay instead of the actual PVC.
        disableMountSubPath: true
        volumeClaimTemplate:
          spec:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
  prometheus-node-exporter:
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  fullnameOverride: grafana
  deploymentStrategy:
    type: Recreate
  initChownData:
    enabled: false
  envFromSecret: grafana-datasources
  grafana.ini:
    server:
      domain: grafana.nezdemkovski.cloud
      root_url: https://grafana.nezdemkovski.cloud
    plugins:
      preinstall_disabled: false
      preinstall_auto_update: false
      disable_plugins: grafana-exploretraces-app,grafana-lokiexplore-app,grafana-metricsdrilldown-app,grafana-pyroscope-app
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
  persistence:
    enabled: true
    storageClassName: local-path
    size: 5Gi
  plugins:
    - grafana-clickhouse-datasource@4.17.0
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      memory: 1536Mi
  datasources:
    datasources.yaml:
      apiVersion: 1
      prune: true
      deleteDatasources:
        - name: NezdemOS Postgres
          orgId: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-prometheus:9090
          isDefault: true
          editable: false
        - name: Plausible ClickHouse
          uid: plausible-clickhouse
          type: grafana-clickhouse-datasource
          access: proxy
          editable: false
          jsonData:
            host: plausible-clickhouse.plausible.svc.cluster.local
            port: 8123
            protocol: http
            username: grafana_reader
            defaultDatabase: plausible_events_db
            validateSql: true
            enableRowLimit: true
          secureJsonData:
            password: $PLAUSIBLE_CLICKHOUSE_PASSWORD
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: cluster
          orgId: 1
          folder: Cluster
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cluster
        - name: analytics
          orgId: 1
          folder: Analytics
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/analytics
  extraConfigmapMounts:
    - name: cluster-overview-dashboard
      mountPath: /var/lib/grafana/dashboards/cluster/cluster-overview.json
      subPath: cluster-overview.json
      configMap: grafana-dashboard-cluster
      readOnly: true
    - name: cluster-diagnostics-dashboard
      mountPath: /var/lib/grafana/dashboards/cluster/cluster-diagnostics.json
      subPath: cluster-diagnostics.json
      configMap: grafana-dashboard-cluster
      readOnly: true
    - name: plausible-analytics-dashboard
      mountPath: /var/lib/grafana/dashboards/analytics/plausible-analytics.json
      subPath: plausible-analytics.json
      configMap: grafana-dashboard-analytics
      readOnly: true

grafana-mcp:
  fullnameOverride: grafana-mcp
  image:
    registry: docker.io
    repository: grafana/mcp-grafana
    tag: "2.3.0"
  grafana:
    url: http://grafana.monitoring.svc.cluster.local:80
    apiKeySecret:
      name: grafana-mcp-token
      key: token
  serverAuth:
    tokenSecret:
      name: grafana-mcp-server-token
      key: token
  # Explicit loopback ports used by the local Codex/Cursor bridge; no wildcard hosts.
  extraArgs:
    - -t
    - sse
    - --address=:8000
    - >-
      --allowed-hosts=localhost:8000,127.0.0.1:8000,[::1]:8000,127.0.0.1:18080,
      127.0.0.1:18081,127.0.0.1:18082,127.0.0.1:18083,127.0.0.1:18084,
      127.0.0.1:18085,127.0.0.1:18086,127.0.0.1:18087,127.0.0.1:18088,
      127.0.0.1:18089,127.0.0.1:18090,127.0.0.1:18091,127.0.0.1:18092,
      127.0.0.1:18093,127.0.0.1:18094,127.0.0.1:18095,127.0.0.1:18096,
      127.0.0.1:18097,127.0.0.1:18098,127.0.0.1:18099,127.0.0.1:18100,
      127.0.0.1:18101,127.0.0.1:18102,127.0.0.1:18103,127.0.0.1:18104,
      127.0.0.1:18105,127.0.0.1:18106,127.0.0.1:18107,127.0.0.1:18108,
      127.0.0.1:18109,127.0.0.1:18110,127.0.0.1:18111
  disableWrite: false
  service:
    type: NodePort
    port: 8000
    nodePort: 30800
  ingress:
    enabled: false
  route:
    main:
      enabled: false
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
