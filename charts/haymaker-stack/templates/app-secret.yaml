apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haymaker-env
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: haymaker-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgres://{{ `{{ .dbUsername | urlquery }}` }}:{{ `{{ .dbPassword | urlquery }}` }}@{{ .Values.postgres.clusterName }}-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}'
        PLAUSIBLE_STATS_API_KEY: '{{ `{{ .plausibleStatsApiKey }}` }}'
        PRICE_CURRENCY: usd
        MAIL_FROM: Haymaker <noreply@haymaker.lol>
        WEB_ORIGIN: https://haymaker.lol
        PUBLIC_WEB_URL: https://haymaker.lol
        PORT: "3001"
  data:
    - secretKey: dbUsername
      remoteRef:
        key: {{ .Values.onepassword.postgresItem }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.onepassword.postgresItem }}
        property: password
    - secretKey: plausibleStatsApiKey
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: PLAUSIBLE_STATS_API_KEY
