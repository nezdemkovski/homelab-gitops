apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: haymaker-env
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: haymaker-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: 'postgres://{{ `{{ .dbUsername | urlquery }}` }}:{{ `{{ .dbPassword | urlquery }}` }}@{{ .Values.postgres.clusterName }}-rw.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}'
        POLAR_ACCESS_TOKEN: '{{ `{{ .polarAccessToken }}` }}'
        POLAR_WEBHOOK_SECRET: '{{ `{{ .polarWebhookSecret }}` }}'
        POLAR_PRODUCT_ID: '{{ `{{ .polarProductId }}` }}'
        POLAR_SERVER: '{{ `{{ .polarServer }}` }}'
        PRICE_CURRENCY: usd
        MAIL_FROM: Haymaker <noreply@haymaker.lol>
        WEB_ORIGIN: https://haymaker.lol
        PUBLIC_WEB_URL: https://haymaker.lol
        PORT: "3001"
  data:
    - secretKey: dbUsername
      remoteRef:
        key: {{ .Values.onepassword.postgresItem }}
        property: username
    - secretKey: dbPassword
      remoteRef:
        key: {{ .Values.onepassword.postgresItem }}
        property: password
    - secretKey: polarAccessToken
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: POLAR_ACCESS_TOKEN
    - secretKey: polarWebhookSecret
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: POLAR_WEBHOOK_SECRET
    - secretKey: polarProductId
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: POLAR_PRODUCT_ID
    - secretKey: polarServer
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: POLAR_SERVER
