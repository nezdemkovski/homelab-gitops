postgres:
  clusterName: haymaker-postgres
  database: haymaker
  owner: haymaker
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-system-trixie
  storage:
    storageClass: local-path
    size: 2Gi
  backup:
    enabled: true
    destinationPath: s3://cnpg-backups/haymaker-postgres
    endpointURL: http://10.77.77.190:9000
    secretName: cnpg-backup-s3
    onepasswordItem: synology-rustfs
    retentionPolicy: "30d"
    schedule: "0 10 4 * * *"

onepassword:
  postgresItem: haymaker-postgres
  appItem: haymaker
  ghcrItem: haymaker-ghcr

haymaker:
  fullnameOverride: haymaker
  image:
    repository: ghcr.io/nezdemkovski/haymaker
    tag: "0.2.0"
    digest: sha256:e0922cfb81e11b399a92b93e7e3e7f0ef71e3e48b9d5f538da313b82e6f33614
  imagePullSecrets:
    - name: haymaker-ghcr
  api:
    existingSecret: haymaker-env
